name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name PDFWatermarkCleaner pdf_watermark_cleaner.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFWatermarkCleaner-windows
          path: dist/PDFWatermarkCleaner.exe

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDFWatermarkCleaner.exe
